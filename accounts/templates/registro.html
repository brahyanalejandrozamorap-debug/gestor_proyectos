{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestor de Proyectos</title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>

    <!-- Estilo reutilizable para los campos -->
    <style type="text/tailwindcss">
        @layer components {
            .campo {
                @apply w-full rounded-full border border-neutral-200 bg-neutral-50 px-5 py-3 text-sm text-neutral-900 outline-none transition placeholder:text-neutral-400 focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-100;
            }
            .etiqueta {
                @apply block text-xs font-semibold text-neutral-700 mb-1.5 ml-2;
            }
        }
    </style>
</head>

<body class="bg-neutral-100 font-sans text-neutral-900 antialiased min-h-screen">

    <!-- BANDA OSCURA SUPERIOR -->
    <div class="absolute inset-x-0 top-0 h-72 bg-neutral-950 overflow-hidden">
        <div class="absolute -right-16 -top-16 w-64 h-64 rounded-full bg-orange-500/20 blur-3xl"></div>
    </div>

    <div class="relative min-h-screen flex items-center justify-center p-4 md:p-6">
        <main class="w-full max-w-lg">

            <!-- Tarjeta de registro -->
            <div class="bg-white border border-neutral-200 rounded-3xl p-6 md:p-8 shadow-xl">

                <!-- Logo y título -->
                <div class="text-center mb-8">
                    <div
                        class="w-16 h-16 bg-neutral-950 rounded-2xl flex items-center justify-center mx-auto mb-4 overflow-hidden ring-4 ring-orange-500">
                        <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-full h-full object-cover">
                    </div>

                    <p class="text-xs font-semibold uppercase tracking-widest text-orange-600 mb-2">
                        Gestor de Proyectos
                    </p>
                    <h1 class="text-2xl font-extrabold tracking-tight text-neutral-950">Crear cuenta</h1>
                    <p class="text-sm text-neutral-500 mt-1">Regístrate para comenzar a gestionar tus proyectos</p>
                </div>

                {% if errors %}
                <div class="mb-5 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
                    <ul class="space-y-1 list-disc list-inside">
                        {% for error in errors %}
                        <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
                {% endif %}

                <!-- Formulario de registro -->
                <form method="post" class="space-y-4">
                    {% csrf_token %}

                    <!-- Campo: Usuario -->
                    <div>
                        <label for="username" class="etiqueta">Usuario</label>
                        <input type="text" name="username" id="username" value="{{ datos.username|default:'' }}"
                            required placeholder="Ej. juan123" class="campo">
                    </div>

                    <!-- Nombre y Apellido -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="first_name" class="etiqueta">Nombre</label>
                            <input type="text" name="first_name" id="first_name"
                                value="{{ datos.first_name|default:'' }}" required placeholder="Ej. Juan" class="campo">
                        </div>

                        <div>
                            <label for="last_name" class="etiqueta">Apellido</label>
                            <input type="text" name="last_name" id="last_name" value="{{ datos.last_name|default:'' }}"
                                required placeholder="Ej. Pérez" class="campo">
                        </div>
                    </div>

                    <!-- Campo: Email -->
                    <div>
                        <label for="email" class="etiqueta">Correo electrónico</label>
                        <input type="email" name="email" id="email" value="{{ datos.email|default:'' }}" required
                            placeholder="ejemplo@correo.com" class="campo">
                    </div>

                    <!-- Contraseñas -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="password1" class="etiqueta">Contraseña</label>
                            <input type="password" name="password1" id="password1" required placeholder="••••••••"
                                class="campo">
                        </div>

                        <div>
                            <label for="password2" class="etiqueta">Confirmar contraseña</label>
                            <input type="password" name="password2" id="password2" required placeholder="••••••••"
                                class="campo">
                        </div>
                    </div>

                    <!-- Botón de submit -->
                    <button type="submit"
                        class="w-full inline-flex items-center justify-center rounded-full bg-orange-500 px-6 py-3.5 text-sm font-bold text-neutral-950 transition hover:bg-neutral-950 hover:text-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-200">
                        Crear cuenta
                    </button>
                </form>

                <!-- Enlace a login -->
                <div class="mt-6 pt-6 border-t border-neutral-100 text-center text-sm text-neutral-500">
                    ¿Ya tienes cuenta?
                    <a href="{% url 'login' %}"
                        class="ml-1 font-bold text-neutral-950 underline decoration-orange-500 decoration-2 underline-offset-4 hover:text-orange-600 transition">
                        Inicia sesión
                    </a>
                </div>
            </div>

        </main>
    </div>
</body>

</html>
