{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>

<body class="bg-neutral-950 font-sans min-h-screen flex flex-col">
    <!-- LOGIN -->
    <main class="flex-1 flex items-center justify-center px-6 py-10">

        <div class="w-full max-w-md">

            <div class="bg-white rounded-2xl border-t-4 border-orange-500 shadow-2xl p-8 sm:p-10">

                <!-- Título -->
                <div class="text-center mb-8">
                    <div
                        class="w-16 h-16 bg-neutral-950 rounded-2xl flex items-center justify-center mx-auto mb-4 overflow-hidden ring-4 ring-orange-500">
                        <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-full h-full object-cover">
                    </div>

                    <h1 class="text-3xl font-extrabold tracking-tight text-neutral-900">
                        Iniciar <span class="text-orange-500">sesión</span>
                    </h1>
                    <p class="mt-2 text-neutral-500">Ingresa a tu cuenta</p>
                </div>

                <!-- Formulario -->
                <form method="POST" class="space-y-5">

                    {% csrf_token %}

                    <!-- Usuario -->
                    <div>
                        <label for="username" class="block text-sm font-semibold text-neutral-700 mb-1.5">
                            Usuario
                        </label>
                        <input type="text" name="username" id="username" required placeholder="Ingresa tu usuario"
                            class="w-full rounded-xl border border-neutral-300 bg-neutral-50 px-4 py-3
                                   placeholder:text-neutral-400 transition
                                   focus:outline-none focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-100">
                    </div>

                    <!-- Contraseña -->
                    <div>
                        <label for="password" class="block text-sm font-semibold text-neutral-700 mb-1.5">
                            Contraseña
                        </label>
                        <input type="password" name="password" id="password" required
                            placeholder="Ingresa tu contraseña"
                            class="w-full rounded-xl border border-neutral-300 bg-neutral-50 px-4 py-3
                                   placeholder:text-neutral-400 transition
                                   focus:outline-none focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-100">
                    </div>

                    <!-- Botón -->
                    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-400 text-neutral-950 font-semibold
                               py-3 rounded-full transition">
                        Iniciar sesión
                    </button>

                </form>

                <!-- Registro -->
                <p class="text-center text-neutral-500 text-sm mt-8">
                    ¿No tienes una cuenta?
                    <a href="{% url 'registro' %}"
                        class="font-semibold text-neutral-900 hover:text-orange-600 transition">
                        Crear cuenta
                    </a>
                </p>

            </div>

        </div>

    </main>

</body>

</html>
