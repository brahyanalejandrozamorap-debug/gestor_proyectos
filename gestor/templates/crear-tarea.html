<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva lección</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>

<body class="bg-neutral-100 font-sans text-neutral-900 min-h-screen">

    <!-- HEADER OSCURO -->
    <header class="bg-neutral-950 text-white">
        <div class="max-w-3xl mx-auto px-6 pt-6 pb-16">

            <a href="{% url 'proyectos' %}" class="flex items-center gap-2 text-sm font-semibold tracking-wide">
                <span class="w-3 h-3 rounded-full bg-orange-500"></span>
                GESTOR DE CURSOS
            </a>

            <a href="{% url 'proyecto_detalle' proyecto.id %}"
                class="inline-block mt-8 text-sm text-neutral-400 hover:text-orange-400 transition">
                ← Volver al curso
            </a>

            <h1 class="mt-3 text-4xl sm:text-5xl font-extrabold tracking-tight">
                Crear <span class="text-orange-500">lección</span>
            </h1>

            <p class="mt-2 text-neutral-400">
                Agrega una nueva lección al curso
                <strong class="text-white font-semibold">{{ proyecto.nombre }}</strong>.
            </p>

        </div>
    </header>


    <!-- FORMULARIO -->
    <main class="max-w-3xl mx-auto px-6 -mt-8 pb-16">

        <div class="bg-white rounded-2xl border-t-4 border-orange-500 shadow-md p-6 sm:p-10">

            <form method="POST" class="space-y-6">

                {% csrf_token %}

                <!-- Proyecto -->
                <div>
                    <label class="block text-sm font-semibold text-neutral-700 mb-1.5">
                        Curso
                    </label>
                    <input type="text" value="{{ proyecto.nombre }}" disabled class="w-full rounded-xl border border-neutral-200 bg-neutral-100 text-neutral-500
                               px-4 py-3 cursor-not-allowed">
                </div>

                <!-- Título -->
                <div>
                    <label for="titulo" class="block text-sm font-semibold text-neutral-700 mb-1.5">
                        Título de la lección
                    </label>
                    <input type="text" name="titulo" id="titulo" required
                        placeholder="Ej: Diseñar la interfaz principal"
                        class="w-full rounded-xl border border-neutral-300 bg-neutral-50 px-4 py-3
                               placeholder:text-neutral-400 transition
                               focus:outline-none focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-100">
                </div>

                <!-- Prioridad y Estado -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

                    <!-- Prioridad -->
                    <div>
                        <label for="prioridad" class="block text-sm font-semibold text-neutral-700 mb-1.5">
                            Prioridad
                        </label>
                        <select name="prioridad" id="prioridad" required
                            class="w-full rounded-xl border border-neutral-300 bg-neutral-50 px-4 py-3 transition
                                   focus:outline-none focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-100">
                            <option value="" selected disabled>Selecciona una prioridad</option>
                            {% for valor, nombre in prioridad_choices %}
                            <option value="{{ valor }}">{{ nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Estado -->
                    <div>
                        <label for="estado" class="block text-sm font-semibold text-neutral-700 mb-1.5">
                            Estado
                        </label>
                        <select name="estado" id="estado" required
                            class="w-full rounded-xl border border-neutral-300 bg-neutral-50 px-4 py-3 transition
                                   focus:outline-none focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-100">
                            <option value="" selected disabled>Selecciona un estado</option>
                            {% for valor, nombre in estado_choices %}
                            <option value="{{ valor }}">{{ nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                </div>

                <hr class="border-neutral-100">

                <!-- Botones -->
                <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3">

                    <a href="{% url 'proyecto_detalle' proyecto.id %}" class="text-center border border-neutral-300 hover:border-neutral-900 text-neutral-700
                               font-semibold px-6 py-3 rounded-full transition">
                        Cancelar
                    </a>

                    <button type="submit" class="bg-orange-500 hover:bg-orange-400 text-neutral-950 font-semibold
                               px-6 py-3 rounded-full transition">
                        Crear lección
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
