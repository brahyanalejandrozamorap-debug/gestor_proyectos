<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Curso</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>

<body class="bg-neutral-100 font-sans text-neutral-900 min-h-screen">

    <!-- HEADER OSCURO -->
    <header class="bg-neutral-950 text-white">
        <div class="max-w-3xl mx-auto px-6 pt-6 pb-16">

            <a href="{% url 'proyectos' %}" class="flex items-center gap-2 text-sm font-semibold tracking-wide">
                <span class="w-3 h-3 rounded-full bg-orange-500"></span>
                GESTOR DE CURSOS
            </a>

            <a href="{% url 'proyectos' %}"
                class="inline-block mt-8 text-sm text-neutral-400 hover:text-orange-400 transition">
                ← Volver a cursos
            </a>

            <h1 class="mt-3 text-4xl sm:text-5xl font-extrabold tracking-tight">
                Crear <span class="text-orange-500">curso</span>
            </h1>

            <p class="mt-2 text-neutral-400">
                Registra un nuevo curso en el sistema.
            </p>

        </div>
    </header>


    <!-- FORMULARIO -->
    <main class="max-w-3xl mx-auto px-6 -mt-8 pb-16">

        <div class="bg-white rounded-2xl border-t-4 border-orange-500 shadow-md p-6 sm:p-10">

            <form method="POST" class="space-y-6">

                {% csrf_token %}

                <!-- Nombre -->
                <div>
                    <label for="nombre" class="block text-sm font-semibold text-neutral-700 mb-1.5">
                        Nombre del curso
                    </label>
                    <input type="text" name="nombre" id="nombre" required placeholder="Ej. Sistema de inventario"
                        class="w-full rounded-xl border border-neutral-300 bg-neutral-50 px-4 py-3
                               placeholder:text-neutral-400 transition
                               focus:outline-none focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-100">
                </div>

                <!-- Descripción -->
                <div>
                    <label for="descripcion" class="block text-sm font-semibold text-neutral-700 mb-1.5">
                        Descripción del curso
                    </label>
                    <textarea name="descripcion" id="descripcion" rows="5" required
                        placeholder="Describe brevemente el proyecto..."
                        class="w-full rounded-xl border border-neutral-300 bg-neutral-50 px-4 py-3
                               placeholder:text-neutral-400 transition resize-y
                               focus:outline-none focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-100"></textarea>
                </div>

                <!-- Duración -->
                <div>
                    <label for="duracion" class="block text-sm font-semibold text-neutral-700 mb-1.5">
                        Duración
                    </label>
                    <div class="flex items-stretch">
                        <input type="number" name="duracion" id="duracion" min="1" required placeholder="Ej. 3"
                            class="flex-1 min-w-0 rounded-l-xl border border-neutral-300 bg-neutral-50 px-4 py-3
                                   placeholder:text-neutral-400 transition
                                   focus:outline-none focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-100">
                        <span class="flex items-center rounded-r-xl border border-l-0 border-neutral-300
                                     bg-neutral-900 text-orange-400 text-sm font-semibold px-4">
                            meses
                        </span>
                    </div>
                </div>

                <hr class="border-neutral-100">

                <!-- Botones -->
                <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3">

                    <a href="{% url 'proyectos' %}" class="text-center border border-neutral-300 hover:border-neutral-900 text-neutral-700
                               font-semibold px-6 py-3 rounded-full transition">
                        Cancelar
                    </a>

                    <button type="submit" class="bg-orange-500 hover:bg-orange-400 text-neutral-950 font-semibold
                               px-6 py-3 rounded-full transition">
                        Crear curso
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
